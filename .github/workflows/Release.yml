name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_dispatch, build the tag that is published, not the branch it was started from.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # The Whisky target has a SwiftLint build phase that fails when swiftlint is missing.
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Build app and CLI (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project Whisky.xcodeproj \
            -scheme Whisky \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -project Whisky.xcodeproj \
            -scheme WhiskyCmd \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate build products
        id: products
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Whisky.app" -type d | head -1)
          CMD=$(find ~/Library/Developer/Xcode/DerivedData -name "WhiskyCmd" -type f -perm +111 | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Whisky.app not found in DerivedData after the build"
            exit 1
          fi
          if [ -z "$CMD" ]; then
            echo "::error::WhiskyCmd executable not found in DerivedData after the build"
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "APP=$APP"
          echo "CMD=$CMD"

      - name: Package artifacts
        run: |
          mkdir -p dist
          cd dist
          ditto -c -k --keepParent "${{ steps.products.outputs.app }}" Reantry.app.zip
          cp "${{ steps.products.outputs.cmd }}" ReantryCmd
          chmod +x ReantryCmd
          shasum -a 256 Reantry.app.zip ReantryCmd > SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/Reantry.app.zip
            dist/ReantryCmd
            dist/SHA256SUMS
          generate_release_notes: true
